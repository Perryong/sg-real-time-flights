name: Publish Changi Observatory
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-pr-{0}', github.event.number) || 'github-pages' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install Redis for shared-cache integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y redis-server
      - run: python -m pip install -r backend/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify tracker with synthetic data
        run: sh scripts/verify-feature.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Build published Pages configuration
        if: github.event_name != 'pull_request'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.LIVE_BACKEND_URL }}
          VITE_LIVE_TRANSPORT: ${{ vars.LIVE_TRANSPORT }}
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist-pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
